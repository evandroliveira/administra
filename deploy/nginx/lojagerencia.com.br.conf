server {
    listen 80;
    listen [::]:80;
    server_name lojagerencia.com.br www.lojagerencia.com.br;

    return 301 https://www.lojagerencia.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lojagerencia.com.br;

    ssl_certificate /etc/letsencrypt/live/lojagerencia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lojagerencia.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.lojagerencia.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lojagerencia.com.br;

    root /var/www/app/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 32M;

    access_log /var/log/nginx/lojagerencia.access.log;
    error_log /var/log/nginx/lojagerencia.error.log;

    ssl_certificate /etc/letsencrypt/live/lojagerencia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lojagerencia.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /sw.js {
        expires -1;
    }

    location = /manifest.webmanifest {
        expires -1;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|avif|woff|woff2)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}